<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausprobe</title>
<meta name="description" content="Neues Dach oder neue Fassade am eigenen Hausfoto ausprobieren.">
<meta name="theme-color" content="#1f7468">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Hausprobe</h1>
      <p class="tag">Neues Dach oder neue Fassade am eigenen Foto ausprobieren.</p>
    </div>
    <div class="row">
      <input id="file" class="sr" type="file" accept="image/*">
      <label class="btn primary" for="file">Foto wählen</label>
      <button id="btn-sample" class="btn" type="button">Beispielhaus</button>
    </div>
  </header>

  <main class="work">
    <section class="stage-col" aria-label="Foto">
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="mode-view" type="button" aria-pressed="true">Vergleichen</button>
        <button id="mode-edit" type="button" aria-pressed="false">Flächen bearbeiten</button>
      </div>
      <div class="stage">
        <canvas id="cv" width="1200" height="800"></canvas>
        <span id="l-before" class="pill">Vorher</span>
        <span id="l-after" class="pill">Nachher</span>
        <span id="badge" class="pill">Beispielhaus (Zeichnung)</span>
      </div>
      <input id="split" type="range" min="0" max="100" value="50" aria-label="Vorher und Nachher vergleichen">
      <div id="actions" class="row">
        <button id="save" class="btn primary" type="button">Bild speichern</button>
        <button id="share" class="btn" type="button" hidden>Teilen</button>
      </div>
      <div id="methods" class="seg" role="group" aria-label="Fläche markieren" hidden>
        <button id="m-auto" type="button" aria-pressed="true">Automatisch</button>
        <button id="m-manual" type="button" aria-pressed="false">Ecken setzen</button>
      </div>
      <div id="tolwrap" class="field" hidden><label class="lbl" for="tol">Fläche kleiner oder größer</label><input id="tol" type="range" min="10" max="70" step="1" value="30"></div>
      <div id="drawbar" class="row" hidden>
        <button id="d-done" class="btn primary" type="button">Fläche fertig</button>
        <button id="d-undo" class="btn" type="button">Punkt zurück</button>
        <button id="d-cancel" class="btn" type="button">Abbrechen</button>
      </div>
      <p id="hint" class="hint" aria-live="polite"></p>
    </section>

    <section class="panel" aria-label="Flächen und Material">
      <h2>Flächen</h2>
      <div id="chips" class="row"></div>
      <div class="row">
        <button id="add-dach" class="btn" type="button">+ Dach</button>
        <button id="add-fassade" class="btn" type="button">+ Fassade</button>
        <button id="add-cut" class="btn" type="button">+ Fenster/Tür aussparen</button>
      </div>
      <div id="editor" hidden>
        <h2 id="ed-title"></h2>
        <div id="ed-style">
          <h3>Material</h3>
          <div id="mats" class="row"></div>
          <h3>Farbe: <span id="color-name"></span></h3>
          <div id="colors" class="swatches"></div>
          <div class="field"><label class="lbl" for="scale">Mustergröße</label><input id="scale" type="range" min="4" max="48" step="1"></div>
          <div class="field"><label class="lbl" for="shade">Licht und Schatten vom Foto</label><input id="shade" type="range" min="0" max="100" step="1"></div>
        </div>
        <div class="row">
          <button id="rot" class="btn" type="button">Muster drehen</button>
          <button id="del" class="btn danger" type="button">Fläche löschen</button>
        </div>
      </div>
      <p class="note">Farben sind Näherungen und ersetzen kein Farbmuster. Dein Foto bleibt auf deinem Gerät und wird nirgends hochgeladen.</p>
    </section>
  </main>
</div>

<script src="detect.js"></script>
<script src="app.js"></script>
</body>
</html>
